[project]
name = "aos-collaboration"
version = "0.1.1"
description = "A local AOS collaboration demo with governed artifact requests and recorded PiSAs replays."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai==3.7.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
aos-collaboration = "aos.collaboration.demo.launch:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aos"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "aos/data"
"THIRD_PARTY_NOTICES.md" = "aos/THIRD_PARTY_NOTICES.md"
"licenses" = "aos/licenses"

[tool.hatch.build.targets.sdist]
include = ["/aos", "/data", "/tests", "/licenses", "/README.md", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml", "/.env.example", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real model provider (not used by the demo test suite)"]
